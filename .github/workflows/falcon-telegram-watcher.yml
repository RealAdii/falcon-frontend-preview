name: Falcon Telegram watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: falcon-telegram-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out watcher state
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check watcher
        run: npm run check

      - name: Check Falcon record once
        run: npm run watch:telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ONCE: 'true'

      - name: Persist watcher state
        run: |
          if [ -f .telegram-watcher-state.json ]; then
            git config user.name "falcon-telegram-watcher[bot]"
            git config user.email "falcon-telegram-watcher[bot]@users.noreply.github.com"
            git add -f .telegram-watcher-state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update Falcon watcher state"
              git push
            fi
          fi
